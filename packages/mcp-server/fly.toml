app = "closepilot-mcp"
primary_region = "iad"

[build]
  dockerfile = "../../packages/mcp-server/Dockerfile"
  ignorefile = "../../.dockerignore"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[checks]
  [checks.health]
    port = 3000
    type = "http"
    interval = "30s"
    timeout = "10s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
