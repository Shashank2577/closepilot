# docker-compose.dev.yml - overlay for local development
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  mcp-server:
    build:
      target: deps
    command: sh -c "pnpm --filter @closepilot/mcp-server dev"
    volumes:
      - ./packages/mcp-server/src:/app/packages/mcp-server/src:ro
      - ./packages/core/src:/app/packages/core/src:ro
    environment:
      NODE_ENV: development

  api:
    build:
      target: deps
    command: sh -c "pnpm --filter @closepilot/api dev"
    volumes:
      - ./packages/api/src:/app/packages/api/src:ro
      - ./packages/core/src:/app/packages/core/src:ro
      - ./packages/db/src:/app/packages/db/src:ro
    environment:
      NODE_ENV: development

  web:
    build:
      target: deps
    command: sh -c "pnpm --filter @closepilot/web dev"
    volumes:
      - ./packages/web/src:/app/packages/web/src:ro
      - ./packages/web/app:/app/packages/web/app:ro
    environment:
      NODE_ENV: development
